    <path d="M15 48 C15 32 25 22 42 22 C52 22 57 26 57 26" stroke="#A77B50" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M16 48 L56 48 C58 48 60 50 60 52 L60 54 C60 56 58 58 56 58 L16 58 C14 58 12 56 12 54 L12 52 C12 50 14 48 16 48 Z" fill="#A77B50" />
    <circle cx="24" cy="59" r="2.5" fill="#E8DFD3" />
    <circle cx="48" cy="59" r="2.5" fill="#E8DFD3" />
    <!-- Monogram letters BSF -->
    <text x="35" y="42" font-family="'Playfair Display', Georgia, serif" font-size="19" font-weight="700" fill="#F6F3EE" text-anchor="middle" letter-spacing="1">B</text>
