    <text x="0" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#77736E" letter-spacing="3.5">&amp; FURNISHING • SILVASSA</text>
  </g>
